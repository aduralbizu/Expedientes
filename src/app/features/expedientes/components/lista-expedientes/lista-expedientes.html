<div class="lista-expedientes-container">
  <table class="tabla-expedientes">
    <thead>
      <tr>
        <th>Nº expediente</th>
        <th>Título</th>
        <th>Estado</th>
        <th>Prioridad</th>
        <th>
          <button type="button" class="th-ordenable" (click)="onOrdenarFechaAlta()">
            Fecha alta
            <span class="icono-orden" [class.icono-orden--activo]="ordenFechaAlta()">{{ ordenFechaAlta() === 'asc' ? '↑' : ordenFechaAlta() === 'desc' ? '↓' : '↕' }}</span>
          </button>
        </th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
        @for (expediente of respuestaExpedientes(); track expediente.numero) {
            <tr>
                <td>{{expediente.numero}}</td>
                <td>{{expediente.titulo}}</td>
                <td>{{expediente.estado}}</td>
                <td>{{expediente.prioridad}}</td>
                <td>{{ expediente.fechaAlta | date: 'dd/MM/yyyy' }}</td>
                <td>
                  <button type="button" class="btn-editar" (click)="onExpedienteClick(expediente)">
                    Ver detalle
                  </button>
                </td>
            </tr>
        }
    </tbody>
  </table>
</div>

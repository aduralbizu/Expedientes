
<form class="formulario-expedientes-container">
  <h1 class="formulario-titulo">Nuevo expediente</h1>
  <div class="formulario-grid">
    <div class="columna">
      <div class="campo">
        <label for="numero">Nº expediente</label>
        <input id="numero" 
            type="text" 
            placeholder="EXP-YYYY-123456"
            [formField]="expedienteForm.numero" />
      </div>

      <div class="campo">
        <label >Estado</label>
        <select id="estado" [formField]="expedienteForm.estado">
          <option value="">Selecciona...</option>
          <option value="abierto">Abierto</option>
          <option value="en_proceso">En trámite</option>
          <option value="cerrado">Cerrado</option>
        </select>
      </div>

      <div class="campo">
        <label >Fecha alta</label>
        <input id="fechaAlta" type="date" [formField]="expedienteForm.fechaAlta" />
      </div>

      <div class="campo">
        <label >Solicitante</label>
        <select id="solicitante" [formField]="expedienteForm.solicitante">
          <option value="">Selecciona...</option>
          <option value="Maria Garcia Lopez">María García López</option>
          <option value="Carlos Martinez Ruiz">Carlos Martínez Ruiz</option>
          <option value="Laura Sanchez Perez">Laura Sánchez Pérez</option>
        </select>
      </div>
    </div>

    <div class="columna">
      <div class="campo">
        <label >Título</label>
        <input id="titulo" type="text" [formField]="expedienteForm.titulo" />
      </div>

      <div class="campo">
        <label >Prioridad</label>
        <select id="prioridad" [formField]="expedienteForm.prioridad">
          <option value="">Selecciona...</option>
          <option value="alta">Alta</option>
          <option value="media">Media</option>
          <option value="baja">Baja</option>
        </select>
      </div>

      <div class="campo">
        <label >Fecha vencimiento</label>
        <input id="fechaVencimiento" type="date" [formField]="expedienteForm.fechaVencimiento" />
      </div>

      <div class="campo">
        <label >Unidad</label>
        <input id="unidad"
         type="text" [formField]="expedienteForm.unidad" 
         placeholder="Unidad responsable" />
      </div>
    </div>

    <div class="campo campo-descripcion">
      <label >Descripción</label>
      <textarea id="descripcion" rows="5" [formField]="expedienteForm.descripcion"></textarea>
    </div>
  </div>

  <div class="acciones-row">
    <button type="button" class="btn btn-secundario" (click)="cancelar()">Cancelar</button>
    <button type="button" class="btn btn-primario" (click)="crear()">Crear</button>
  </div>
</form>

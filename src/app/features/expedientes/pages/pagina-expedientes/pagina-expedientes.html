<div class="pagina-expedientes">

  <h2>Listado de expedientes</h2>

  <div class="seccion seccion-filtro">
    <app-filtro-expedientes (filtrosExpediente)="filtraExpedientes($event)"></app-filtro-expedientes>
  </div>

  <div class="seccion seccion-lista">
    <app-lista-expedientes [respuestaExpedientes]="getlistaexpedientes()" (productoSeleccionado)="seleccionDeCliente($event)"></app-lista-expedientes>
    @if (respuestaRecursos(); as respuesta) {
      <app-expedientes-listado-paginacion
        [skip]="respuesta.skip"
        [totalItems]="respuesta.total"
        [itemsPorPagina]="respuesta.limit"
        (cambioPagina)="cambioPagina($event)">
      </app-expedientes-listado-paginacion>
    }
  </div>
</div>
